[project]
name = "180days"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-dotenv>=1.0.1",
    "pymongo==4.18.2",
    "pydantic>=2.6.4",
    "email-validator>=2.2.0",
    "pyjwt>=2.10.1",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "tzdata>=2024.2",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.server:app"

[tool.vercel.scripts]
build = "corepack yarn@1.22.22 --cwd frontend install --frozen-lockfile && corepack yarn@1.22.22 --cwd frontend build"
